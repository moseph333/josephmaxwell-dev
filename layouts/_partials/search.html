<div
  id="search-wrapper"
  class="invisible fixed inset-0 z-50 flex h-screen w-screen cursor-default flex-col bg-neutral-500/50 p-4 backdrop-blur-sm dark:bg-neutral-900/50 sm:p-6 md:p-[10vh] lg:p-[12vh]"
  data-url="{{ "" | absLangURL }}"
>
  <div
    id="search-modal"
    role="dialog"
    aria-modal="true"
    aria-label="{{ i18n "search.open_button_title" | default "Search site" }}"
    class="top-20 mx-auto flex min-h-0 w-full max-w-3xl flex-col rounded-md border border-neutral-200 bg-neutral shadow-lg dark:border-neutral-700 dark:bg-neutral-800"
  >
    <header class="relative z-10 flex flex-none items-center justify-between px-2">
      <form class="flex min-w-0 flex-auto items-center" action="javascript:void(0);" onsubmit="return false;" role="search">
        <label for="search-query" class="sr-only">{{ i18n "search.input_placeholder" | default "Search" }}</label>
        <div class="flex h-8 w-8 items-center justify-center text-neutral-400" aria-hidden="true">
          {{ partial "icon.html" "search" }}
        </div>
        <input
          type="search"
          id="search-query"
          name="q"
          class="mx-1 flex h-12 flex-auto appearance-none bg-transparent focus:outline-dotted focus:outline-2 focus:outline-transparent"
          placeholder="{{ i18n "search.input_placeholder" }}"
          aria-label="{{ i18n "search.input_placeholder" | default "Search" }}"
          tabindex="0"
          autocomplete="off"
        />
        <button type="submit" class="sr-only">{{ i18n "search.open_button_title" | default "Search" }}</button>
      </form>
      <button
        id="close-search-button"
        class="flex h-8 w-8 items-center justify-center text-neutral-700 hover:text-primary-600 dark:text-neutral dark:hover:text-primary-400"
        title="{{ i18n "search.close_button_title" }}"
        aria-label="{{ i18n "search.close_button_title" | default "Close search modal" }}"
      >
        <span aria-hidden="true">{{ partial "icon.html" "xmark" }}</span>
      </button>
    </header>
    <section class="flex-auto overflow-auto px-2">
      <div id="search-status" class="sr-only" role="status" aria-live="polite"></div>
      <ul id="search-results">
      </ul>
    </section>
  </div>
</div>
